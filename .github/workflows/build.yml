name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to upload assets to releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow customtkinter nuitka

      - name: Build with Nuitka
        run: >
          python -m nuitka
          --standalone
          --onefile
          --assume-yes-for-downloads
          --windows-console-mode=disable
          --enable-plugin=tk-inter
          --windows-icon-from-ico=icon.ico
          --onefile-tempdir-spec="%CACHE_DIR%/JackboxLauncher"
          --include-data-dir=game_images=game_images
          --include-data-files=icon.ico=icon.ico
          --output-filename=JackboxPartypackLauncher.exe
          launcher.py

      - name: Upload exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: JackboxPartypackLauncher.exe
          draft: false
          generate_release_notes: true
